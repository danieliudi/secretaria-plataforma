name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all functions
        # --prune: remove no Supabase qualquer função que não exista mais em
        # supabase/functions/** — sem isso, functions deletadas do repo (ou
        # deployadas manualmente fora do CI, como o complexity-router órfão)
        # continuam ativas pra sempre. O repo vira a fonte da verdade.
        run: supabase functions deploy --project-ref edaogdfeuxrylwqpopqe --prune --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

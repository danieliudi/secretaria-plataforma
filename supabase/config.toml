# `verify_jwt` versionado aqui em vez de só no dashboard: um redeploy sem
# este arquivo não reseta o valor por acidente, e fica documentado o porquê
# de cada função.
#
# false = a função faz sua PRÓPRIA autenticação (ver
# supabase/functions/_shared/internal-auth.ts, checagem de
# Authorization: Bearer <service_role>). verify_jwt=true NÃO é um limite
# real pra endpoint interno: a chave publicável (pública, embutida no
# bundle do site) também é um JWT válido do projeto e passaria.
#
# /cron: chamado só pelo pg_cron (via Vault + pg_net) — precisa aceitar a
# service_role key nova (formato sb_secret_..., que não é JWT e por isso
# NUNCA passaria verify_jwt=true).
[functions.cron]
verify_jwt = false

# /fast: chamado só internamente (reflex, cron) com a service_role key.
[functions.fast]
verify_jwt = false

# /telegram: webhook público do Telegram — não manda JWT nenhum.
[functions.telegram]
verify_jwt = false

# /reflex: chamado só pelo n8n, que autentica com REFLEX_WEBHOOK_SECRET no
# header X-Webhook-Secret (temSegredoDeWebhook, comparação em tempo constante).
#
# Ficou `true` de 10/08 a 31/08 porque a trava própria do /reflex ainda estava
# em "modo observação" e o verify_jwt era a única camada. A observação acabou em
# 28/08 e a recusa de verdade entrou em vigor — mas o config nunca foi
# atualizado junto, e aí o gateway virou um problema em vez de uma proteção:
#
#  - Ele NUNCA foi um limite real. A chave publicável é um JWT válido do
#    projeto e vai no bundle do navegador por design — verificado hoje: uma
#    requisição com ela passa o gateway e é recusada pelo NOSSO código, que é
#    quem de fato protege (ver o cabeçalho de _shared/internal-auth.ts).
#  - E ele obriga o n8n a gastar o único slot de credencial do nó HTTP com o
#    `Authorization`, o que força o X-Webhook-Secret a ficar em TEXTO PURO no
#    parâmetro do nó, visível pra quem abrir o workflow. Um portão que não
#    protege estava impedindo o portão que protege de ser guardado direito.
#
# Com `false`, o segredo vai pro slot de credencial (criptografado no n8n) e a
# autenticação passa a ser uma só, real e auditável.
[functions.reflex]
verify_jwt = false

# /wa-webhook: webhook público da Meta (WhatsApp Cloud API) — não manda JWT
# nenhum, mesma situação do /telegram. Quem autentica é a assinatura HMAC-SHA256
# do corpo cru contra o META_APP_SECRET (_shared/meta-webhook.ts), e sem esse
# secret configurado a função recusa TUDO — ausência de segredo nunca vira
# modo aberto.
[functions.wa-webhook]
verify_jwt = false

# /import-csv: chamado só pelo n8n (workflow WhatsApp) com a service_role key
# — mesmo motivo do /fast/telegram/cron. Enforced desde o dia 1 (não passou
# pelo período de "modo observação" que o /reflex teve).
[functions.import-csv]
verify_jwt = false

# /teams: webhook público do Bot Framework Connector — manda um JWT, mas é o
# DELE (assinado com a chave do Bot Framework, não a do nosso projeto
# Supabase), então verify_jwt=true recusaria tudo. Quem autentica é
# validarTokenBotFramework (_shared/teams-auth.ts) contra o JWKS público do
# Bot Framework — mesmo espírito do secret_token do Telegram/HMAC da Meta.
[functions.teams]
verify_jwt = false
